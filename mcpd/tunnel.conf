# Configuracion del supervisor phone-mcp. Rutas relatives al $HOME de Termux.
PORT=${PHONE_MCP_PORT:-8001}
SERVER="$HOME/phone-mcp/server.py"
KEY="$HOME/.ssh/localhost_run"
SSHUSER_HOST=localhost.run
# Opcional: publica la URL del tunel en un gist propio (nada de esto va en el repo).
# Define GIST_ID y GIST_FILE en ~/phone-mcp/secrets.env si quieres esa comodidad.
GIST_FILE=mcp_url.txt
LOGDIR="$HOME/mcpd/logs"
STATE="$HOME/mcpd/state"
HEALTH="http://localhost:$PORT/health"
